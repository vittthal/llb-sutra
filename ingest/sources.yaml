# The ingest contract. NOTHING enters the database without an entry here.
#
# licence values (see backend/app/licence.py):
#   public          treaties, UN/ICJ material          -> full text servable
#   govt-public     Indian bare acts, judgments        -> full text servable
#   owned-licensed  books/notes you legally own        -> retrieval only, 200-char excerpt
#   excerpt-only    most restricted                    -> 50-char excerpt
#
# Verify URLs with:  python -m ingest.fetch_sources --dry-run

subjects:
  - code: CPC
    name: Civil Procedure Code, 1908 & Limitation Act, 1963
