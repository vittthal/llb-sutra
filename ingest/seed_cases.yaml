  - name: State of Haryana v. Bhajan Lal
    year: 1992
    subject: BNSS
    topics: [quashing-of-fir]
    note: Section 482 CrPC -> Section 528 BNSS. The seven categories.

  - name: Nandini Satpathy v. P.L. Dani
    year: 1978
    subject: BNSS
    topics: [investigation, self-incrimination]

  - name: Selvi v. State of Karnataka
    year: 2010
    subject: BNSS
    topics: [investigation, self-incrimination]
