# Leading judgments per Sem V subject, tagged to topics.
#
# These are the cases that actually get asked, so the corpus starts with them rather
# than with whatever a crawl happens to find first.
#
# VERIFY BEFORE INGESTING. Names and years here are a starting list. The fetcher
# resolves each against DigiSCR (digiscr.sci.gov.in) — the Supreme Court's own official
# reporter — and the FETCHED record populates the database, not this file.
#
# Once PYQ analytics is running it will show which cases your examiners actually
# favour; extend this list from that data.

cases:
  # --- CPC & Limitation Act ------------------------------------------------
  - name: Dhulabhai v. State of Madhya Pradesh
    year: 1968
    subject: CPC
    topics: [jurisdiction-of-civil-courts]
    note: Section 9 - when the jurisdiction of a civil court is barred.

  - name: Kiran Singh v. Chaman Paswan
    year: 1954
    subject: CPC
    topics: [jurisdiction-of-civil-courts]
    note: A decree passed without jurisdiction is a nullity.

  - name: Satyadhyan Ghosal v. Deorajin Debi
    year: 1960
    subject: CPC
    topics: [res-judicata]
    note: Section 11 - res judicata.

  - name: Daryao v. State of Uttar Pradesh
    year: 1961
    subject: CPC
    topics: [res-judicata]
    note: Res judicata applied to writ petitions.

  - name: Gurbux Singh v. Bhooralal
    year: 1964
    subject: CPC
    topics: [order-2-rule-2]
    note: Order II Rule 2 - splitting of claims.

  - name: T. Arivandandam v. T.V. Satyapal
    year: 1977
    subject: CPC
    topics: [rejection-of-plaint]
    note: Order VII Rule 11 - vexatious and meritless plaints.

  - name: Saleem Bhai v. State of Maharashtra
    year: 2003
    subject: CPC
    topics: [rejection-of-plaint]

  - name: Dalpat Kumar v. Prahlad Singh
    year: 1992
    subject: CPC
    topics: [temporary-injunction]
    note: Order XXXIX - prima facie case, balance of convenience, irreparable injury.

  - name: Gujarat Bottling Co. v. Coca Cola Co.
    year: 1995
    subject: CPC
    topics: [temporary-injunction]

  - name: Salem Advocate Bar Association v. Union of India (II)
    year: 2005
    subject: CPC
    topics: [cpc-amendments]

  - name: Collector, Land Acquisition, Anantnag v. Mst. Katiji
    year: 1987
    subject: CPC
    topics: [condonation-of-delay]
    note: Section 5, Limitation Act - liberal construction of sufficient cause.

  - name: N. Balakrishnan v. M. Krishnamurthy
    year: 1998
    subject: CPC
    topics: [condonation-of-delay]

  - name: Basawaraj v. Special Land Acquisition Officer
    year: 2013
    subject: CPC
    topics: [condonation-of-delay]
    note: Limits of the liberal approach.

  # --- BNSS (leading authorities are CrPC-era; principles carry across) -----
  - name: Lalita Kumari v. Government of Uttar Pradesh
    year: 2014
    subject: BNSS
    topics: [fir-registration]
    note: Registration of FIR is mandatory for cognizable offences.

  - name: Arnesh Kumar v. State of Bihar
    year: 2014
    subject: BNSS
    topics: [arrest]
    note: Arrest guidelines. Section 41 CrPC -> Section 35 BNSS.

  - name: Joginder Kumar v. State of Uttar Pradesh
    year: 1994
    subject: BNSS
    topics: [arrest]

  - name: D.K. Basu v. State of West Bengal
    year: 1997
